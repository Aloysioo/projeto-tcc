<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto de Virada — Domine o ENEM</title>
<style>
:root{
  --bg-0:#fbfaf7;
  --bg-1:#ffffff;
  --bg-2:#f4f2ed;
  --bg-3:#e9e6df;
  --border:#cfcbc2;
  --border-soft:#e4e1d9;
  --text-0:#1d1c1a;
  --text-1:#4b4943;
  --text-2:#6b675e;
  --accent:#1f3a5f;
  --accent-hover:#16294a;
  --blue:#1f3a5f;
  --blue-bright:#1f3a5f;
  --purple:#1f3a5f;
  --orange:#1f3a5f;
  --orange-bright:#1f3a5f;
  --pink:#1f3a5f;
  --teal:#1f3a5f;
  --green:#2f6b4f;
  --danger:#a3322b;
  --radius-s:3px;
  --radius-m:6px;
  --radius-l:8px;
  --font-display:Georgia,'Times New Roman',serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--blue);color:#fff;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.02em;}
p{margin:0;}
.container{max-width:1180px;margin:0 auto;padding:0 32px;}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--bg-0);}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:10px;}

/* ---------- NAVBAR ---------- */
.navbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,13,26,0.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.nav-inner{
  max-width:1180px;margin:0 auto;padding:0 32px;
  height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap;}
.brand svg{flex-shrink:0;}
.brand .m1{color:var(--text-0);}
.brand .m2{background:linear-gradient(120deg,var(--blue-bright),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;gap:4px;flex:1;justify-content:center;}
.nav-burger{display:none;background:none;border:1px solid var(--border);color:var(--text-0);width:38px;height:38px;border-radius:9px;align-items:center;justify-content:center;flex-shrink:0;}
.nav-links-mobile{display:none;}
.nav-link{
  padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;
  color:var(--text-1);transition:color .15s, background .15s;white-space:nowrap;
}
.nav-link:hover{color:var(--text-0);background:var(--bg-2);}
.nav-link.active{color:var(--text-0);background:var(--bg-3);}
.nav-auth{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.nav-guest{display:flex;gap:10px;}
.nav-user{display:flex;align-items:center;gap:10px;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--text-1);}
.streak-chip{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--orange);background:rgba(245,165,36,0.12);padding:5px 10px;border-radius:999px;}
.professor-link{display:none;}
.professor-link.role-visible{display:inline-block;}
.student-link.role-hidden{display:none;}
.role-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--text-1);background:rgba(140,107,240,0.14);padding:3px 9px;border-radius:999px;margin-left:8px;}
.user-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;flex-shrink:0;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:10px;border:none;font-size:14px;font-weight:600;
  transition:transform .12s, box-shadow .15s, opacity .15s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(61,123,250,0.35);}
.btn-primary:hover{background:var(--blue-bright);}
.btn-orange{background:linear-gradient(135deg,var(--orange),var(--orange-bright));color:#1a1204;box-shadow:0 4px 16px rgba(245,165,36,0.3);}
.btn-orange:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;color:var(--text-0);border:1px solid var(--border);}
.btn-outline:hover{background:var(--bg-2);border-color:var(--text-2);}
.btn-ghost{background:transparent;color:var(--text-1);padding:10px 14px;}
.btn-ghost:hover{color:var(--text-0);}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}

/* ---------- PAGES ---------- */
.page{display:none;animation:fadein .35s ease;}
.page.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- LOGIN ---------- */
.auth-wrap{min-height:100vh;width:100%;display:flex;}
.auth-left{
  flex:1 1 46%;
  background:
    radial-gradient(circle at 20% 20%, rgba(61,123,250,0.25), transparent 55%),
    radial-gradient(circle at 80% 85%, rgba(140,107,240,0.22), transparent 50%),
    linear-gradient(160deg,#0a1330 0%, #0d1024 100%);
  padding:56px 60px;display:flex;flex-direction:column;justify-content:center;
  border-right:1px solid var(--border-soft);
  min-height:100vh;
}
.auth-left .brand{margin-bottom:56px;}
.auth-left h1{font-size:38px;line-height:1.15;color:var(--text-0);}
.auth-left h1 span{
  display:block;
  background:linear-gradient(120deg,var(--blue-bright),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.auth-left>p{margin-top:16px;color:var(--text-1);font-size:15px;line-height:1.6;max-width:400px;}
.auth-bullets{margin-top:36px;display:flex;flex-direction:column;gap:16px;}
.auth-bullet{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--text-1);}
.auth-bullet .ico{
  width:26px;height:26px;border-radius:7px;background:rgba(61,123,250,0.16);
  display:flex;align-items:center;justify-content:center;color:var(--blue-bright);flex-shrink:0;
}
.auth-foot{margin-top:auto;padding-top:40px;color:var(--text-2);font-size:12.5px;}
.auth-right{
  flex:1 1 54%;display:flex;align-items:center;justify-content:center;
  padding:40px;min-height:100vh;
}
.auth-form{width:100%;max-width:380px;}
.auth-form h2{font-size:26px;color:var(--text-0);}
.auth-form>p.sub{margin-top:8px;color:var(--text-1);font-size:14px;}
.field{margin-top:22px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:7px;}
.input-wrap{position:relative;}
.input-wrap > svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-2);pointer-events:none;}
.input-wrap input{
  width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text-0);
  padding:12px 14px 12px 40px;border-radius:10px;font-size:14.5px;outline:none;
  transition:border-color .15s, background .15s;
}
.input-wrap input:focus{border-color:var(--blue);background:var(--bg-3);}
.input-wrap .toggle-eye{
  position:absolute;left:auto;right:13px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  pointer-events:auto;cursor:pointer;color:var(--text-2);
}
.input-wrap .toggle-eye:hover{color:var(--text-0);}
.input-wrap input[type]{padding-right:40px;}
.field-error{color:var(--danger);font-size:12.5px;margin-top:6px;display:none;align-items:center;gap:5px;}
.field-error.show{display:flex;}
.pw-rules{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.pw-rule{display:flex;align-items:center;gap:7px;font-size:12.3px;color:var(--text-2);transition:color .15s;}
.pw-rule svg{flex-shrink:0;color:var(--text-2);transition:color .15s;}
.pw-rule.ok{color:var(--green);}
.pw-rule.ok svg{color:var(--green);}
.auth-submit{margin-top:26px;}
.auth-switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--text-1);}
.auth-switch a{color:var(--blue-bright);font-weight:600;}
.auth-switch a:hover{text-decoration:underline;}
.role-switch-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:16px;padding:13px 18px;border-radius:10px;
  border:1.5px solid rgba(140,107,240,0.4);background:rgba(140,107,240,0.08);
  color:#cdbdfb;font-size:14.5px;font-weight:700;text-align:center;
  transition:background .15s, border-color .15s;
}
.role-switch-btn:hover{background:rgba(140,107,240,0.16);border-color:rgba(140,107,240,0.65);}

/* ---------- HERO ---------- */
.hero{padding:88px 0 56px;text-align:center;position:relative;}
.hero::before{
  content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:900px;height:420px;
  background:radial-gradient(ellipse at center, rgba(61,123,250,0.18), transparent 65%);
  pointer-events:none;z-index:-1;
}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--bg-2);border:1px solid var(--border);
  padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-1);
  margin-bottom:26px;
}
.pill svg{color:var(--orange);}
.hero h1{font-size:48px;line-height:1.15;color:var(--text-0);}
.hero h1 .grad{
  display:block;
  background:linear-gradient(120deg,var(--blue-bright) 10%,var(--purple) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero>p{max-width:560px;margin:22px auto 0;color:var(--text-1);font-size:16.5px;line-height:1.6;}
.hero-actions{display:flex;gap:14px;justify-content:center;margin-top:32px;}
.stats-row{
  max-width:920px;margin:56px auto 0;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-l);
  overflow:hidden;
}
.stat{padding:26px 18px;text-align:center;border-right:1px solid var(--border-soft);}
.stat:last-child{border-right:none;}
.stat .num{font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--text-0);}
.stat .num.orange{color:var(--orange);}
.stat .lbl{font-size:12.5px;color:var(--text-2);margin-top:5px;}
.weekly-goal-teaser{
  max-width:920px;margin:18px auto 0;padding:16px 22px;
  background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  text-align:left;
}
.weekly-goal-text{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-1);margin-bottom:10px;}
.weekly-goal-text svg{color:var(--green);flex-shrink:0;}
.weekly-goal-text b{color:var(--text-0);}
.weekly-goal-track{height:7px;background:var(--bg-3);border-radius:4px;overflow:hidden;}
.weekly-goal-fill{height:100%;background:var(--green);border-radius:4px;transition:width .5s;}

/* ---------- SECTION HEADER ---------- */
.section-head{text-align:center;max-width:600px;margin:0 auto 40px;}
.section-eyebrow{color:var(--blue-bright);font-size:13px;font-weight:700;margin-bottom:10px;}
.section-head h2{font-size:30px;color:var(--text-0);}
.section-head p{margin-top:10px;color:var(--text-1);font-size:15px;line-height:1.6;}
section.block{padding:64px 0;}
section.block.alt{background:var(--bg-1);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}

/* ---------- AREAS GRID (home) ---------- */
.areas-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.area-card{
  background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  padding:24px 18px;text-align:center;transition:border-color .15s, transform .15s;
}
.area-card:hover{border-color:var(--border);transform:translateY(-3px);}
.area-ico{
  width:46px;height:46px;border-radius:12px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
}
.area-card h4{font-size:15px;color:var(--text-0);margin-bottom:5px;}
.area-card p{font-size:12.5px;color:var(--text-2);}

/* ---------- PAGE HEADER (dashboard pages) ---------- */
.page-head{padding:52px 0 36px;text-align:center;}
.page-head h1{font-size:34px;color:var(--text-0);}
.page-head p{max-width:520px;margin:12px auto 0;color:var(--text-1);font-size:15px;line-height:1.6;}
.page-body{padding-bottom:72px;}

/* ---------- CARDS: lessons (Dicas) ---------- */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:28px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:220px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-2);}
.search-wrap input{
  width:100%;background:var(--bg-1);border:1px solid var(--border-soft);color:var(--text-0);
  padding:11px 14px 11px 40px;border-radius:10px;font-size:14px;outline:none;
}
.search-wrap input:focus{border-color:var(--blue);}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;}
.filter-pill{
  display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;
  background:var(--bg-1);border:1px solid var(--border-soft);color:var(--text-1);
  font-size:13.5px;font-weight:600;transition:all .15s;
}
.filter-pill:hover{border-color:var(--border);color:var(--text-0);}
.filter-pill.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.lesson-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.lesson-card{
  background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  padding:20px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s;
  position:relative;
}
.lesson-card:hover{border-color:var(--border);transform:translateY(-2px);}
.fav-btn{
  position:absolute;top:14px;right:14px;z-index:2;
  width:30px;height:30px;border-radius:50%;border:1px solid var(--border-soft);background:rgba(8,13,26,0.6);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:color .15s, border-color .15s, transform .12s;
}
.fav-btn:hover{color:var(--accent);border-color:var(--accent);transform:scale(1.08);}
.fav-btn.active{color:var(--accent);border-color:var(--accent);}
.video-card .fav-btn{top:10px;right:10px;}
.lesson-card .lesson-top{padding-right:34px;}
.lesson-top{display:flex;align-items:flex-start;justify-content:space-between;}
.lesson-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.tag{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.tag-Essencial{background:rgba(245,165,36,0.16);color:var(--orange);}
.tag-Importante{background:rgba(61,123,250,0.16);color:var(--blue-bright);}
.tag-Avançado{background:rgba(140,107,240,0.18);color:var(--text-1);}
.tag-Intermediário{background:rgba(49,184,198,0.16);color:var(--teal);}
.lesson-card h4{font-size:15px;color:var(--text-0);line-height:1.3;}
.lesson-card .desc{font-size:12.8px;color:var(--text-2);line-height:1.5;flex:1;}
.lesson-bottom{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding-top:10px;border-top:1px solid var(--border-soft);}
.lesson-time{display:flex;align-items:center;gap:5px;color:var(--text-2);}
.lesson-link{font-weight:700;display:flex;align-items:center;gap:4px;}
.empty-note{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-2);font-size:14px;}

/* ---------- GUIA ENEM ---------- */
.guia-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.guia-card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:24px;}
.guia-card-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.guia-card-head .ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.guia-card-head h3{font-size:16px;color:var(--text-0);}
.guia-item{padding:12px 0;border-top:1px solid var(--border-soft);display:flex;gap:10px;}
.guia-item:first-of-type{border-top:none;}
.guia-item svg{flex-shrink:0;margin-top:2px;color:var(--text-2);}
.guia-item .t{font-size:14px;font-weight:600;color:var(--text-0);}
.guia-item .d{font-size:12.8px;color:var(--text-2);margin-top:3px;line-height:1.5;}
.tips-card{
  grid-column:1/-1;background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  padding:24px;
}
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 30px;margin-top:16px;}
.tip-row{display:flex;gap:10px;font-size:13.5px;color:var(--text-1);line-height:1.5;}
.tip-row svg{flex-shrink:0;margin-top:2px;color:var(--orange);}
.guia-cta{display:flex;gap:12px;justify-content:center;margin-top:32px;}

/* ---------- RENDIMENTO ---------- */
.empty-state{
  text-align:center;padding:64px 24px;background:var(--bg-1);border:1px solid var(--border-soft);
  border-radius:var(--radius-l);max-width:480px;margin:0 auto;
}
.empty-icon{
  width:52px;height:52px;border-radius:14px;background:var(--bg-3);margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;color:var(--text-1);
}
.empty-state h3{font-size:17px;color:var(--text-0);margin-bottom:8px;}
.empty-state p{color:var(--text-2);font-size:13.5px;margin-bottom:22px;}
.perf-wrap{display:none;}
.perf-wrap.show{display:block;}
.perf-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
.perf-box{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:22px;text-align:center;}
.perf-box .num{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--text-0);}
.perf-box .lbl{font-size:12.5px;color:var(--text-2);margin-top:4px;}
.chart-card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:26px;}
.chart-card h3{font-size:15px;margin-bottom:22px;color:var(--text-0);}
.bar-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.bar-row .lbl{width:150px;font-size:13px;color:var(--text-1);flex-shrink:0;}
.bar-track{flex:1;height:10px;background:var(--bg-3);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
.bar-row .pct{width:38px;text-align:right;font-size:13px;font-weight:700;color:var(--text-0);flex-shrink:0;}

/* ---------- CRONOGRAMA ---------- */
.cron-progress{
  background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);
  padding:18px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;
}
.cron-progress-left{display:flex;align-items:center;gap:12px;}
.cron-progress-left svg{color:var(--green);flex-shrink:0;}
.cron-progress-text .t{font-size:14px;font-weight:600;color:var(--text-0);}
.cron-progress-bar{width:180px;height:6px;background:var(--bg-3);border-radius:4px;margin-top:8px;overflow:hidden;}
.cron-progress-bar-fill{height:100%;background:var(--green);border-radius:4px;transition:width .4s;}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:22px;}
.day-col{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:14px;min-height:150px;display:flex;flex-direction:column;}
.day-col .day-name{font-size:11.5px;font-weight:700;color:var(--text-2);letter-spacing:.03em;margin-bottom:12px;}
.day-chips{display:flex;flex-direction:column;gap:6px;flex:1;}
.day-chip{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:6px 9px;border-radius:7px;font-size:12px;font-weight:600;
}
.day-chip button{background:none;border:none;color:inherit;opacity:.6;font-size:13px;line-height:1;padding:0;}
.day-chip button:hover{opacity:1;}
.day-add{
  margin-top:10px;background:none;border:1px dashed var(--border);color:var(--text-2);
  border-radius:7px;padding:7px 8px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;
}
.day-add:hover{border-color:var(--blue);color:var(--blue-bright);}
.cron-grid-wrap{overflow-x:auto;padding-bottom:10px;margin-bottom:22px;}
.cron-table{display:grid;grid-template-columns:76px repeat(7,minmax(112px,1fr));gap:8px;min-width:880px;}
.cron-head-cell{font-size:11.5px;font-weight:700;color:var(--text-2);text-align:center;padding:4px;letter-spacing:.02em;}
.cron-period-label{font-size:11.5px;font-weight:700;color:var(--text-1);display:flex;align-items:center;padding:4px 2px;line-height:1.3;}
.cron-cell{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:10px;min-height:58px;display:flex;align-items:stretch;justify-content:center;}
.cron-cell-add{background:var(--bg-1);border:1px dashed var(--border);color:var(--text-2);border-radius:9px;width:100%;display:flex;align-items:center;justify-content:center;font-size:11.5px;gap:4px;padding:6px;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;cursor:pointer;font-family:inherit;}
.cron-cell-add:hover, .cron-cell-add:focus{border-color:var(--blue);color:var(--blue-bright);outline:none;}
.cron-cell-add option{background:var(--bg-2);color:var(--text-0);}
.cron-chip{width:100%;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 9px;border-radius:9px;font-size:12px;font-weight:700;}
.cron-chip button{background:none;border:none;color:inherit;opacity:.65;font-size:14px;line-height:1;padding:0;flex-shrink:0;}
.cron-chip button:hover{opacity:1;}
.cron-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
.sim-flagship{border-color:rgba(245,165,36,0.35);background:linear-gradient(135deg, rgba(245,165,36,0.08), var(--bg-1));}
.sim-topbar{position:sticky;top:64px;background:rgba(8,13,26,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);padding:14px 0;z-index:20;}
.sim-title{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-0);}
.sim-timer{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--text-0);background:var(--bg-2);padding:7px 14px;border-radius:999px;border:1px solid var(--border-soft);flex-shrink:0;}
.sim-timer svg{color:var(--blue-bright);}
.sim-timer.sim-timer-danger{color:var(--danger);border-color:rgba(255,103,103,0.4);}
.sim-timer.sim-timer-danger svg{color:var(--danger);}
.sim-progress-row{display:flex;align-items:center;gap:14px;margin:6px 0 4px;font-size:12.5px;color:var(--text-2);white-space:nowrap;}
.sim-progress-track{flex:1;height:6px;background:var(--bg-3);border-radius:4px;overflow:hidden;}
.sim-progress-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .25s;}
.sim-nav-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0 48px;flex-wrap:wrap;}
.sim-dots{display:flex;gap:5px;flex-wrap:wrap;max-width:360px;justify-content:center;order:3;flex-basis:100%;}
@media (min-width:700px){.sim-dots{order:0;flex-basis:auto;}}
.sim-dot{width:7px;height:7px;border-radius:50%;background:var(--bg-3);flex-shrink:0;}
.sim-dot.done{background:var(--blue-bright);}
.sim-dot.active{background:var(--orange);transform:scale(1.4);}

/* ---------- VÍDEO-AULAS ---------- */
.video-section{margin-bottom:44px;}
.video-section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.video-section-head h3{font-size:18px;color:var(--text-0);}
.video-section-head p{font-size:12.5px;color:var(--text-2);margin-top:2px;}
.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.video-card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);overflow:hidden;cursor:pointer;transition:border-color .15s, transform .15s;display:flex;flex-direction:column;position:relative;}
.video-card:hover{border-color:var(--border);transform:translateY(-2px);}
.video-thumb{position:relative;height:100px;display:flex;align-items:center;justify-content:center;}
.video-play-btn{
  width:42px;height:42px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;
  background:rgba(8,13,26,0.55);padding-left:3px;
}
.video-thumb-time{position:absolute;bottom:8px;right:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,0.55);padding:3px 8px;border-radius:6px;display:flex;align-items:center;gap:4px;}
.video-card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.video-card-body h4{font-size:14px;color:var(--text-0);line-height:1.3;}
.video-card-body .desc{font-size:12px;color:var(--text-2);line-height:1.5;}

.video-player{position:relative;border-radius:var(--radius-l);overflow:hidden;border:1px solid var(--border-soft);aspect-ratio:16/8;display:flex;flex-direction:column;justify-content:flex-end;}
.video-player-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,7,15,0.25);}
.video-big-play{
  width:64px;height:64px;border-radius:50%;border:2px solid;background:rgba(8,13,26,0.6);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding-left:4px;transition:transform .15s;
}
.video-big-play:hover{transform:scale(1.08);}
.video-player-title{color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,0.5);padding:0 20px;text-align:center;}
.video-done-badge{
  position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:7px;
  background:rgba(8,13,26,0.85);padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
}
.video-controls{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(5,7,15,0.75);backdrop-filter:blur(6px);}
.video-ctrl-btn{background:none;border:none;color:#fff;flex-shrink:0;display:flex;align-items:center;cursor:pointer;padding:0;}
.video-progress-track{flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:4px;overflow:hidden;cursor:pointer;}
.video-progress-fill{height:100%;width:0;border-radius:4px;}
.video-time{font-size:11.5px;color:#e5e9f2;flex-shrink:0;white-space:nowrap;}
.video-player-real{position:relative;border-radius:var(--radius-l);overflow:hidden;border:1px solid var(--border-soft);aspect-ratio:16/9;background:#000;}
.video-player-real iframe{width:100%;height:100%;border:0;display:block;}
@media (max-width:900px){.video-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.video-grid{grid-template-columns:1fr;}.video-player{aspect-ratio:16/11;}}
.comp-block{margin-bottom:18px;}
.comp-bar-row{margin-bottom:6px;}
.comp-lbl{width:230px;}
.comp-fb{color:var(--text-2);font-size:12.8px;line-height:1.5;margin-left:230px;padding-left:14px;}
@media (max-width:700px){
  .comp-lbl{width:100%;margin-bottom:6px;}
  .comp-bar-row{flex-wrap:wrap;}
  .comp-fb{margin-left:0;padding-left:0;margin-top:4px;}
}
.plan-tips{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:22px;margin-bottom:26px;}
.plan-tips h4{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-0);margin-bottom:14px;}
.plan-tips h4 svg{color:var(--orange);}
.plan-tips .tip-row{margin-bottom:8px;}
.cron-actions{display:flex;gap:12px;justify-content:center;}

/* ---------- CONTATO ---------- */
.contact-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start;}
.contact-form-card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:26px;}
.contact-form-card textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text-0);
  padding:12px 14px;border-radius:10px;font-size:14px;outline:none;resize:vertical;min-height:110px;font-family:inherit;
}
.contact-form-card textarea:focus{border-color:var(--blue);}
.quick-card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:16px;margin-bottom:14px;}
.quick-card h4{font-size:13px;color:var(--text-1);margin-bottom:12px;font-weight:700;}
.quick-link{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;transition:background .15s;
}
.quick-link:hover{background:var(--bg-2);}
.quick-link .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.quick-link .t{font-size:13.5px;font-weight:600;color:var(--text-0);}
.quick-link .d{font-size:11.5px;color:var(--text-2);margin-top:1px;}
.quick-link svg.arrow{margin-left:auto;color:var(--text-2);flex-shrink:0;}
.faq-item{border-top:1px solid var(--border-soft);}
.faq-item:first-child{border-top:none;}
.faq-q{
  width:100%;background:none;border:none;color:var(--text-0);text-align:left;
  padding:16px 4px;display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:600;
}
.faq-q svg{color:var(--text-2);transition:transform .2s;flex-shrink:0;}
.faq-item.open .faq-q svg{transform:rotate(180deg);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.faq-item.open .faq-a{max-height:200px;}
.faq-a p{padding:0 4px 16px;color:var(--text-2);font-size:13.5px;line-height:1.6;}

/* ---------- FOOTER ---------- */
.footer{border-top:1px solid var(--border-soft);background:var(--bg-1);padding:52px 0 26px;margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:32px;}
.footer-brand p{color:var(--text-2);font-size:13px;margin-top:12px;line-height:1.6;max-width:260px;}
.footer-col h5{font-size:13px;color:var(--text-0);margin-bottom:14px;}
.footer-col a{display:block;color:var(--text-2);font-size:13px;padding:6px 0;}
.footer-col a:hover{color:var(--text-0);}
.footer-bottom{
  border-top:1px solid var(--border-soft);margin-top:36px;padding-top:20px;
  display:flex;justify-content:space-between;color:var(--text-2);font-size:12.5px;flex-wrap:wrap;gap:10px;
}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-3);border:1px solid var(--border);color:var(--text-0);
  padding:13px 22px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:1000;
  display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{color:var(--green);flex-shrink:0;}
.toast.toast-error svg{color:var(--danger);}

/* ---------- RESPONSIVE ---------- */
@media (max-width:980px){
  .auth-wrap{flex-direction:column;}
  .auth-left{border-right:none;border-bottom:1px solid var(--border-soft);min-height:auto;padding:44px 32px;}
  .auth-right{min-height:auto;padding:44px 24px;}
  .nav-links{display:none;}
  .nav-burger{display:flex;}
  .nav-links-mobile.open{
    display:flex;flex-direction:column;gap:2px;
    position:absolute;top:64px;left:0;right:0;
    background:var(--bg-1);border-bottom:1px solid var(--border-soft);
    padding:10px 16px 16px;z-index:99;
  }
  .nav-links-mobile.open .nav-link{padding:12px 10px;border-radius:8px;}
  .areas-grid{grid-template-columns:repeat(2,1fr);}
  .lesson-grid{grid-template-columns:repeat(2,1fr);}
  .guia-grid{grid-template-columns:1fr;}
  .tips-grid{grid-template-columns:1fr;}
  .week-grid{grid-template-columns:repeat(4,1fr);}
  .contact-grid{grid-template-columns:1fr;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .stat{border-bottom:1px solid var(--border-soft);}
  .footer-grid{grid-template-columns:repeat(2,1fr);}
  .hero h1{font-size:36px;}
  .perf-summary{grid-template-columns:1fr;}
  .cron-stats{grid-template-columns:1fr;}
}
@media (max-width:600px){
  .container{padding:0 18px;}
  .lesson-grid{grid-template-columns:1fr;}
  .areas-grid{grid-template-columns:1fr 1fr;}
  .week-grid{grid-template-columns:repeat(2,1fr);}
  .hero{padding:56px 0 40px;}
  .hero h1{font-size:29px;}
  .nav-inner{padding:0 16px;}
}

/* ============================================================
   TEMA CLARO E MINIMALISTA
   ============================================================ */
html{scroll-behavior:auto;}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;}
h1,h2,h3,h4,h5{font-weight:600;letter-spacing:0;}
::selection{background:#d9e2ef;color:var(--text-0);}
::-webkit-scrollbar-track{background:var(--bg-0);}
::-webkit-scrollbar-thumb{background:var(--border);}

.navbar{background:var(--bg-1);backdrop-filter:none;border-bottom:1px solid var(--border);}
.brand{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text-0);}
.brand svg{display:none;}
.brand .m1,.brand .m2{background:none;color:var(--text-0);-webkit-text-fill-color:currentColor;}
.nav-links{gap:2px;}
.nav-link{border-radius:0;padding:6px 9px;font-weight:500;border-bottom:2px solid transparent;}
.nav-link:hover{background:none;color:var(--text-0);}
.nav-link.active{background:none;color:var(--text-0);border-bottom-color:var(--accent);}
.user-avatar{background:var(--bg-3);color:var(--text-0);border:1px solid var(--border);font-weight:600;}
.streak-chip{background:none;color:var(--text-1);padding:0;border-radius:0;font-weight:500;font-size:13px;}
.streak-chip span{color:var(--text-0);font-weight:600;}
.role-badge{background:none;color:var(--text-2);padding:0;margin-left:4px;font-size:12px;font-weight:500;border-radius:0;}
.role-badge::before{content:'· ';}

.btn{border-radius:4px;font-weight:600;font-size:14px;box-shadow:none;}
.btn:active{transform:none;}
.btn-primary,.btn-orange{background:var(--accent);background-image:none;color:#fff;box-shadow:none;}
.btn-primary:hover,.btn-orange:hover{background:var(--accent-hover);filter:none;}
.btn-outline{background:var(--bg-1);color:var(--text-0);border:1px solid var(--border);}
.btn-outline:hover{background:var(--bg-2);border-color:var(--text-2);}
.btn-ghost{color:var(--text-1);}
.btn-ghost:hover{color:var(--text-0);}

.input-wrap input{border-radius:4px;background:#fff;}
.input-wrap input:focus{border-color:var(--accent);background:#fff;}
.search-wrap input{border-radius:4px;background:#fff;border-color:var(--border);}
.search-wrap input:focus{border-color:var(--accent);}

.auth-left{background:var(--bg-2);border-right:1px solid var(--border);}
.auth-left h1{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.2;}
.auth-left h1 span{background:none;-webkit-text-fill-color:currentColor;color:var(--text-0);font-size:inherit;font-weight:inherit;margin-top:0;}
.auth-bullet{color:var(--text-1);}
.auth-bullet .ico{background:none;color:var(--accent);width:auto;height:auto;}
.role-switch-btn{border:1px solid var(--border);background:var(--bg-1);color:var(--text-1);font-weight:600;font-size:14px;border-radius:4px;}
.role-switch-btn:hover{background:var(--bg-2);border-color:var(--text-2);}

.pill{background:none;border:none;border-radius:0;padding:0;margin-bottom:12px;font-size:13px;font-weight:500;color:var(--text-2);display:inline-block;}
.pill svg{display:none;}
a.pill{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
.page-head > .pill:not(a){display:none;}
.page-head{padding:44px 0 26px;}
.page-head h1{font-size:32px;}
.page-head p{color:var(--text-1);}

.lesson-ico,.area-ico,.guia-card-head .ico,.empty-icon,.quick-link .ico{display:none !important;}
.guia-card,.lesson-card,.video-card,.area-card,.chart-card,.perf-box,.quick-card,.empty-state,.contact-form-card,.cron-progress,.day-col,.plan-tips,.tips-card{border-radius:6px;box-shadow:none;}
.lesson-card:hover,.video-card:hover,.area-card:hover{transform:none;border-color:var(--text-2);}
.perf-box .num{font-weight:600;}
.tag{background:transparent !important;color:var(--text-1) !important;border:1px solid var(--border);border-radius:3px;font-size:11px;font-weight:600;padding:2px 8px;}
.lesson-link,.lesson-link svg{color:var(--accent) !important;}
.lesson-link{font-weight:600;}
.filter-pill{border-radius:4px;background:var(--bg-1);border:1px solid var(--border);}
.filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.fav-btn{background:var(--bg-1);border:1px solid var(--border);color:var(--text-2);transform:none !important;}
.fav-btn:hover,.fav-btn.active{color:var(--accent);border-color:var(--accent);}

.bar-track{height:8px;border-radius:2px;background:var(--bg-3);}
.bar-fill{border-radius:2px;background:var(--accent) !important;}
.cron-progress-bar-fill{background:var(--accent);}
.cron-cell,.cron-cell-add,.cron-chip,.day-chip{border-radius:4px;}
.cron-cell-add{background:var(--bg-1);}

.sim-topbar{background:var(--bg-1);backdrop-filter:none;border-bottom:1px solid var(--border);}
.sim-timer{border-radius:4px;background:var(--bg-1);}
.sim-timer svg{color:var(--text-2);}
.sim-flagship{background:var(--bg-1);border-color:var(--border-soft);}
.sim-progress-fill{background:var(--accent);border-radius:2px;}
.sim-dot.active{background:var(--accent);transform:none;}
.sim-dot.done{background:var(--text-2);}

.video-play-btn{background:var(--bg-1);color:var(--accent) !important;border-color:var(--border) !important;}
.video-thumb{border-bottom:1px solid var(--border-soft);}
.video-player,.video-player-real{border-radius:6px;border:1px solid var(--border);}

.toast{background:#1c1b19;color:#fff;border:none;border-radius:4px;box-shadow:none;}
.toast svg{color:#9fd3b6;}
.toast.toast-error svg{color:#f0aaa3;}
.footer{background:var(--bg-2);border-top:1px solid var(--border);}

.weekly-goal-teaser{max-width:none;margin:22px 0 0;padding:0;border:none;background:none;border-radius:0;}
.weekly-goal-text{color:var(--text-1);}
.weekly-goal-text svg{display:none;}
.weekly-goal-track{background:var(--bg-3);height:6px;border-radius:2px;}
.weekly-goal-fill{background:var(--accent);border-radius:2px;}

.home-intro{padding:64px 0 36px;max-width:720px;}
.home-intro h1{font-size:40px;line-height:1.2;margin-bottom:16px;}
.home-intro p{color:var(--text-1);font-size:17px;line-height:1.65;max-width:620px;}
.home-actions{display:flex;gap:18px;align-items:center;margin-top:26px;flex-wrap:wrap;}
.home-link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;}
.home-intro .home-note{margin-top:30px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--bg-2);font-size:15px;color:var(--text-1);max-width:620px;}
.home-section{padding:20px 0 56px;max-width:860px;}
.home-section h2{font-size:24px;margin-bottom:16px;}
.toc{border-top:1px solid var(--border);}
.toc-row{display:flex;gap:28px;align-items:baseline;padding:15px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.toc-row:hover{background:var(--bg-2);}
.toc-row .t{font-weight:600;color:var(--accent);min-width:170px;}
.toc-row .d{color:var(--text-1);}
.home-areas{margin-top:20px;color:var(--text-2);font-size:14px;}
@media (max-width:700px){
  .home-intro{padding:36px 0 20px;}
  .home-intro h1{font-size:30px;}
  .toc-row{flex-direction:column;gap:2px;}
  .toc-row .t{min-width:0;}
}

.nav-inner{max-width:1400px;padding:0 24px;gap:20px;}
.nav-link{font-size:13px;padding:6px 6px;}
.brand{font-size:18px;}
.bar-row .pct{width:auto;min-width:38px;white-space:nowrap;}
.footer-brand .brand{gap:5px;}
@media (max-width:1240px){
  .nav-links{display:none;}

   API — conexão com o back-end em PHP (substitui o Supabase)
   Ajuste API_BASE se os arquivos PHP estiverem em outra pasta.
   ============================================================ */
const API_BASE = 'backend/';

async function apiFetch(path, options={}){
  try{
    const res = await fetch(API_BASE + path, {
      method: options.method || 'GET',
      credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    let json;
    try{ json = await res.json(); } catch(e){ json = null; }
    if(!res.ok || !json){
      return { ok:false, status:res.status, data:null, message: (json && json.message) || 'Não foi possível conectar ao servidor.' };
    }
    return { ok: json.success!==false, status:res.status, data:json, message: json.message||'' };
  } catch(err){
    console.error('Erro de conexão com o back-end:', err);
    return { ok:false, status:0, data:null, message:'Não foi possível conectar ao servidor. Verifique se o PHP/MySQL estão rodando e recarregue a página.' };
  }
}

  'pa-pg': {
    paragraphs:[
      'Progressões descrevem sequências de números que seguem um padrão. Na Progressão Aritmética (PA), cada termo é obtido somando sempre o mesmo valor (razão) ao anterior — como o número de assentos que aumenta de forma constante entre fileiras de um cinema. Na Progressão Geométrica (PG), cada termo é obtido multiplicando sempre o mesmo valor (razão) — como o crescimento de bactérias que dobram a cada hora.',
      'Reconhecer se um problema é PA ou PG é o passo mais importante: se o "salto" entre valores é sempre uma soma fixa, é PA; se é sempre uma multiplicação fixa, é PG. Isso aparece em contextos de juros, popularização de notícias, crescimento populacional e depreciação de veículos.'

    keypoints:[

      'Juro simples se comporta como PA; juro composto se comporta como PG.',

function diasAteEnem(){
  const diff = ENEM_DATE.getTime() - Date.now();
  return Math.max(0, Math.ceil(diff/(1000*60*60*24)));
}
function enemCountdownText(){
  const diff = ENEM_DATE.getTime() - Date.now();
  if(diff <= -86400000) return 'A primeira prova do ENEM 2026 já foi aplicada.';
  const d = diasAteEnem();
  if(d === 0) return 'A primeira prova do ENEM 2026 é hoje.';
  if(d === 1) return 'Falta 1 dia para a primeira prova do ENEM 2026 (8 de novembro).';
  return 'Faltam ' + d + ' dias para a primeira prova do ENEM 2026 (8 de novembro).';
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function toast(msg, type){
  const el = document.getElementById('toast');
  const isError = type==='error';
  el.classList.toggle('toast-error', isError);
  el.innerHTML = icon(isError?'alert':'checkCircle') + '<span>'+msg+'</span>';
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>el.classList.remove('show'), 2600);
}

const PROTECTED = ['rendimento','cronograma','redacao','simulado-play','favoritos','atividades','professor-home','professor-alunos','professor-aluno-detalhe'];
const STUDENT_ONLY = ['home','guia','dicas','videoaulas','simulados','redacao','rendimento','favoritos','cronograma','simulado-play','video-player','aula'];

function nav(page){
  if(PROTECTED.includes(page) && !state.user){ page = 'login'; toast('Entre na sua conta para continuar'); }
  if(state.user && state.user.role==='professor'){
    if(page==='home') page = 'professor-home';
    if(STUDENT_ONLY.includes(page)) page = 'professor-home';
  } else if(PROFESSOR_ONLY.includes(page)){
    page = 'home';
  }
  if(page==='simulado-play' && !state.sim){ page = 'simulados'; }
  stopSimTimer();
  const activeKey = page==='aula' ? 'dicas' : (page==='simulado-play' ? 'simulados' : (page==='video-player' ? 'videoaulas' : (page==='professor-aluno-detalhe' ? 'professor-alunos' : page)));

  document.getElementById('navbar').style.display = (page==='login'||page==='cadastro'||page==='cadastro-professor') ? 'none' : '';
  render(page);
  window.scrollTo({top:0, behavior:'instant'});

function animateStats(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.dataset.count,10);
    const suffix = el.dataset.suffix||'';
    const dur = 1000; const t0 = performance.now();
    function step(t){
      const p = Math.min(1,(t-t0)/dur);
      const val = Math.floor(p*target);
      el.textContent = val.toLocaleString('pt-BR')+suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function wireFavButtons(container){

function wireDicas(){
  wireFavButtons();
  const grid = document.getElementById('lessonGrid');
  function apply(){
    const q = document.getElementById('lessonSearch').value.trim().toLowerCase();
    const activePill = document.querySelector('.filter-pill.active');
    const area = activePill ? activePill.dataset.area : '';
    let visible = 0;
    grid.querySelectorAll('.lesson-card').forEach(card=>{
      const matchArea = !area || card.dataset.area===area;
      const matchQ = !q || card.dataset.title.includes(q);
      const show = matchArea && matchQ;
      card.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    let empty = grid.querySelector('.empty-note');
    if(visible===0){
      if(!empty){ empty = document.createElement('div'); empty.className='empty-note'; empty.textContent='Nenhuma aula encontrada para essa busca.'; grid.appendChild(empty); }
    } else if(empty){ empty.remove(); }

  document.getElementById('lessonSearch').addEventListener('input', apply);
  document.querySelectorAll('.filter-pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('.filter-pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active'); apply();

  grid.querySelectorAll('[data-open-lesson]').forEach(a=>{

function wireAula(){
  const l = LESSONS.find(x=>x.id===state.currentLessonId) || LESSONS[0];
  const c = LESSON_CONTENT[l.id];
  wireFavButtons();
  document.querySelectorAll('.quiz-opt').forEach(lab=>{
    lab.addEventListener('click', ()=>{
      const q = lab.closest('.quiz-q');
      q.querySelectorAll('.quiz-opt').forEach(o=>o.style.borderColor='var(--border-soft)');
      lab.style.borderColor = 'var(--blue)';
    });
  });
  document.getElementById('quizForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    let correct = 0;
    let allAnswered = true;
    document.querySelectorAll('.quiz-q').forEach(qEl=>{
      const qi = parseInt(qEl.dataset.qi,10);
      const checked = qEl.querySelector('input:checked');
      const fb = qEl.querySelector('.quiz-feedback');
      if(!checked){ allAnswered = false; return; }
      const chosen = parseInt(checked.value,10);
      const isRight = chosen === c.quiz[qi].correct;
      if(isRight) correct++;
      qEl.querySelectorAll('.quiz-opt').forEach((lab,oi)=>{
        lab.style.pointerEvents='none';
        if(oi===c.quiz[qi].correct) { lab.style.borderColor='var(--green)'; lab.style.background='rgba(47,191,130,0.1)'; }
        else if(oi===chosen && !isRight){ lab.style.borderColor='var(--danger)'; lab.style.background='rgba(255,103,103,0.08)'; }
      });
      fb.style.display='block';
      fb.style.background = isRight ? 'rgba(47,191,130,0.1)' : 'rgba(255,103,103,0.08)';
      fb.style.border = '1px solid ' + (isRight ? 'rgba(47,191,130,0.3)' : 'rgba(255,103,103,0.3)');
      fb.innerHTML = `<strong style="color:${isRight?'var(--green)':'var(--danger)'}">${isRight?'Certo! ':'Errado. '}</strong><span style="color:var(--text-1)">${c.quiz[qi].explain}</span>`;
    });
    if(!allAnswered){ toast('Responda todas as questões antes de corrigir'); return; }
    document.getElementById('quizSubmitBtn').style.display='none';
    const result = document.getElementById('quizResult');
    result.style.display='block';
    document.getElementById('quizScoreText').textContent = `Você acertou ${correct} de ${c.quiz.length}`;
    document.getElementById('quizScoreSub').textContent = correct===c.quiz.length
      ? 'Mandou muito bem! Você domina esse conteúdo.'
      : (correct===0 ? 'Releia os pontos-chave acima e tente novamente.' : 'Bom progresso — revise as explicações e tente de novo para fixar.');
    result.scrollIntoView({behavior:'smooth', block:'center'});
  });
  document.getElementById('quizRetryBtn')?.addEventListener('click', ()=>{ nav('aula'); });
}

function wireVideoPlayer(){
  if(state.currentRealVideo) return;
  const l = LESSONS.find(x=>x.id===state.currentLessonId) || LESSONS[0];
  const totalSeconds = 30; // duração real (compactada) da simulação do player
  let elapsed = (state.videoProgress||0) * totalSeconds;
  let playing = false;
  let raf = null;

  const overlay = document.getElementById('videoOverlay');
  const playBtn = document.getElementById('videoPlayBtn');
  const ctrlBtn = document.getElementById('videoCtrlBtn');
  const fill = document.getElementById('videoProgressFill');
  const timeText = document.getElementById('videoTimeText');
  const doneBadge = document.getElementById('videoDoneBadge');
  const track = document.getElementById('videoProgressTrack');

  function formatVideoTime(pct){
    const totalMin = l.min;
    const cur = Math.floor(pct*totalMin);
    return String(cur).padStart(2,'0')+':00 / '+String(totalMin).padStart(2,'0')+':00';
  }
  function render(){
    const pct = Math.min(1, elapsed/totalSeconds);
    fill.style.width = (pct*100)+'%';
    timeText.textContent = formatVideoTime(pct);
    state.videoProgress = pct;
  }
  function tick(ts){
    if(!playing) return;
    elapsed += 1/30;
    if(elapsed>=totalSeconds){
      elapsed = totalSeconds;
      render();
      pause();
      doneBadge.style.display='flex';
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }
  function play(){
    playing = true;
    overlay.style.display='none';
    doneBadge.style.display='none';
    ctrlBtn.innerHTML = ICO.pause;
    raf = requestAnimationFrame(tick);
  }
  function pause(){
    playing = false;
    ctrlBtn.innerHTML = ICO.play;
    if(raf) cancelAnimationFrame(raf);
  }
  playBtn.addEventListener('click', play);
  ctrlBtn.addEventListener('click', ()=>{ playing ? pause() : play(); if(!playing) overlay.style.display='none'; });
  track.addEventListener('click', (e)=>{
    const rect = track.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0,(e.clientX-rect.left)/rect.width));
    elapsed = pct*totalSeconds;
    render();
    overlay.style.display='none';
    doneBadge.style.display='none';
  });
  render();

  document.getElementById('videoDoQuizBtn').addEventListener('click', ()=>{ nav('aula'); });
  const prevBtn = document.getElementById('videoPrevBtn');
  const nextBtn = document.getElementById('videoNextBtn');
  const areaLessons = lessonsByArea(l.area);
  const idx = areaLessons.findIndex(x=>x.id===l.id);
  if(prevBtn && areaLessons[idx-1]) prevBtn.addEventListener('click', ()=>{ state.currentLessonId = areaLessons[idx-1].id; state.videoProgress=0; nav('video-player'); });
  if(nextBtn && areaLessons[idx+1]) nextBtn.addEventListener('click', ()=>{ state.currentLessonId = areaLessons[idx+1].id; state.videoProgress=0; nav('video-player'); });
}

function stopSimTimer(){
  if(window._simInterval){ clearInterval(window._simInterval); window._simInterval = null; }
}
function startSimTimer(){
  stopSimTimer();
  window._simInterval = setInterval(()=>{
    if(!state.sim){ stopSimTimer(); return; }
    state.sim.timeLeft--;
    const t = document.getElementById('simTimerText');
    if(t) t.textContent = formatTime(state.sim.timeLeft);
    const wrap = document.getElementById('simTimerWrap');
    if(wrap) wrap.classList.toggle('sim-timer-danger', state.sim.timeLeft<=60);
    if(state.sim.timeLeft<=0){
      finishSimulado(true);
    }
  }, 1000);
}
function formatTime(s){
  s = Math.max(0,s);
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function refreshSimPlay(){
  document.getElementById('app').innerHTML = tplSimPlay();

function finishSimulado(byTimeout){
  stopSimTimer();
  const s = state.sim;
  if(!s || s.phase==='result') return;
  s.phase = 'result';
  s.finished = true;
  s.timedOut = !!byTimeout;
  if(byTimeout) toast('Tempo esgotado! Corrigindo com o que foi respondido...', 'error');
  const total = s.questions.length;
  let correct = 0;
  s.questions.forEach((q,i)=>{ if(s.answers[i]===q.c) correct++; });
  const notaEstimada = Math.round(correct/total*1000);
  insertSimuladoHistorico(s.mode, s.areaLabel, correct, total, notaEstimada, s.essay ? s.essayText : null);
  refreshSimPlay();
}

/* ---------- REVISÃO ORTOGRÁFICA E GRAMATICAL (usada no corretor de redação) ---------- */
function proofreadIssues(text){
  const issues = [];
  if(!text || !text.trim()) return issues;
  const paragraphs = text.split(/\n+/).map(p=>p.trim()).filter(Boolean);

  const noPunct = paragraphs.filter(p=>!/[.!?…]$/.test(p));
  if(noPunct.length){
    issues.push({label:'Pontuação final ausente', detail: noPunct.length+' parágrafo(s) não terminam com ponto final, exclamação ou interrogação.'});
  }
  const dupSpaces = (text.match(/ {2,}/g)||[]).length;
  if(dupSpaces>0){
    issues.push({label:'Espaços duplicados', detail: dupSpaces+' ocorrência(s) de espaço duplo encontrada(s).'});
  }
  const dupWordMatches = text.match(/\b(\w+)\s+\1\b/gi) || [];
  if(dupWordMatches.length){
    issues.push({label:'Palavra repetida seguida', detail:'Encontrado: "'+[...new Set(dupWordMatches)].slice(0,3).join('", "')+'". Revise essas repetições.'});
  }
  const informal = ['vc','vcs','pq','tb','tbm','mto','naum','blz','q','eh','neh','oq'];
  const lowerWords = normalizeTxt(text).split(/[^a-z]+/).filter(Boolean);
  const foundInformal = [...new Set(lowerWords.filter(w=>informal.includes(w)))];
  if(foundInformal.length){
    issues.push({label:'Linguagem informal', detail:'Evite abreviações como: '+foundInformal.slice(0,5).join(', ')+'. Prefira a norma culta na redação.'});
  }
  const afterPeriod = text.match(/[.!?]\s+[a-zà-ú]/g) || [];
  if(afterPeriod.length){
    issues.push({label:'Letra minúscula após pontuação', detail: afterPeriod.length+' frase(s) parecem começar com letra minúscula logo após um ponto final.'});
  }
  const stop = ['que','para','com','uma','um','das','dos','como','mais','muito','isso','essa','esse','pela','pelo','são','esta','está','ser','ele','ela','nos','nas','por','sua','seu','também','entre','sobre'];
  const freq = {};
  normalizeTxt(text).split(/[^a-z]+/).filter(Boolean).forEach(w=>{ if(w.length>4 && !stop.includes(w)) freq[w]=(freq[w]||0)+1; });
  const heavy = Object.entries(freq).filter(([w,c])=>c>=5).sort((a,b)=>b[1]-a[1]);
  if(heavy.length){
    issues.push({label:'Repetição excessiva de palavras', detail:'A palavra "'+heavy[0][0]+'" aparece '+heavy[0][1]+' vezes. Tente usar sinônimos para variar o texto.'});
  }
  return issues;
}
function proofreadBlockHTML(issues){
  return `
  <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border-soft)">
    <h4 style="font-size:14px;color:var(--text-0);margin-bottom:12px;display:flex;align-items:center;gap:8px">${ICO.alert}Revisão ortográfica e gramatical</h4>
    ${issues.length===0
      ? `<div class="tip-row">${ICO.checkCircle}Nenhum problema estrutural óbvio encontrado. Bom trabalho!</div>`
      : issues.map(it=>`<div class="tip-row" style="align-items:flex-start"><span style="color:var(--danger);flex-shrink:0">${ICO.alert}</span><span><b style="color:var(--text-0)">${it.label}:</b> ${it.detail}</span></div>`).join('')}
  </div>`;
}

  'Desafios para a valorização de comunidades e povos tradicionais no Brasil',
  'Caminhos para combater a desinformação nas redes sociais no Brasil',
  'O desafio de reduzir as desigualdades no acesso à educação digital no Brasil',
];
const CONECTIVOS = ['portanto','contudo','entretanto','além disso','dessa forma','desse modo','por conseguinte','consequentemente','no entanto','embora','ademais','assim','logo','uma vez que','visto que','já que','em suma','por fim','primeiramente','em primeiro lugar','por outro lado','nesse sentido','sobretudo','outrossim'];
const INTERV_KEYWORDS = ['é necessário','é preciso','deve','cabe ao','a fim de','com o objetivo de','para que','por meio de','através de','política pública','campanha','projeto de lei','conscientização','fiscalização'];
const INTERV_AGENTES = ['governo','estado','poder público','escola','família','sociedade','mídia','ministério','município','prefeitura','ongs','universidades'];

function normalizeTxt(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function analisarRedacao(text){
  const clean = text.trim();
  const paragraphs = clean.split(/\n+/).map(p=>p.trim()).filter(Boolean);
  const words = clean.split(/\s+/).filter(Boolean);
  const wordCount = words.length;
  const sentences = clean.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const avgSentenceLen = sentences.length ? wordCount/sentences.length : 0;
  const lower = normalizeTxt(clean);

  let connectiveHits = 0;
  CONECTIVOS.forEach(c=>{
    const re = new RegExp(normalizeTxt(c).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    const m = lower.match(re); if(m) connectiveHits += m.length;
  });

  const lastPara = normalizeTxt(paragraphs[paragraphs.length-1]||'');
  const interventionHits = INTERV_KEYWORDS.filter(k=>lastPara.includes(normalizeTxt(k))).length;
  const agentHits = INTERV_AGENTES.filter(a=>lastPara.includes(normalizeTxt(a))).length;
  const paragraphCount = paragraphs.length;

  let comp1;
  if(wordCount < 80) comp1 = 40;
  else if(avgSentenceLen>0 && avgSentenceLen<9) comp1 = 100;
  else if(avgSentenceLen>=9 && avgSentenceLen<=28) comp1 = 180;
  else comp1 = 120;

  let comp2;
  if(paragraphCount<3) comp2 = 80;
  else if(paragraphCount<=5) comp2 = 180;
  else comp2 = 140;

  const devParagraphs = Math.max(0, paragraphCount-2);
  let comp3;
  if(devParagraphs>=2 && connectiveHits>=3) comp3 = 180;
  else if(devParagraphs>=1 && connectiveHits>=1) comp3 = 130;
  else comp3 = 80;

  let comp4;
  if(connectiveHits>=6) comp4 = 180;
  else if(connectiveHits>=3) comp4 = 140;
  else if(connectiveHits>=1) comp4 = 100;
  else comp4 = 60;

  let comp5;
  if(interventionHits>=2 && agentHits>=1) comp5 = 180;
  else if(interventionHits>=1 || agentHits>=1) comp5 = 120;
  else comp5 = 60;

  if(wordCount < 50){ comp1=Math.min(comp1,40); comp2=Math.min(comp2,60); comp3=Math.min(comp3,40); comp4=Math.min(comp4,40); comp5=Math.min(comp5,40); }

  const total = comp1+comp2+comp3+comp4+comp5;
  return {wordCount, paragraphCount, connectiveHits, interventionHits, agentHits, avgSentenceLen, comp1, comp2, comp3, comp4, comp5, total};
}
function tierFeedback(score, msgs){
  if(score>=180) return msgs.alto;
  if(score>=120) return msgs.medio;
  return msgs.baixo;
}
function feedbackText(r){
  return {
    comp1: tierFeedback(r.comp1, {
      alto:'Boas frases, com extensão equilibrada — nem curtas demais, nem emendadas em excesso.',
      medio:'Estrutura das frases razoável. Revise pontuação e evite frases muito longas ou muito curtas.',
      baixo:'Texto muito curto ou frases muito irregulares — capriche na extensão e na formalidade do texto.',
    }),
    comp2: tierFeedback(r.comp2, {
      alto:'Estrutura dissertativa clara: introdução, desenvolvimento e conclusão bem distribuídos.',
      medio:'Estrutura ok, mas revise a divisão em parágrafos — o ideal são 4 ou 5 parágrafos.',
      baixo:'Poucos parágrafos identificados. Organize o texto em introdução, 2 parágrafos de desenvolvimento e conclusão.',
    }),
    comp3: tierFeedback(r.comp3, {
      alto:'Argumentação consistente, com desenvolvimento e conectivos que sustentam as ideias.',

    }),
    comp4: tierFeedback(r.comp4, {
      alto:'Bom uso de conectivos (' + r.connectiveHits + ' encontrados), o que garante coesão entre as ideias.',
      medio:'Uso mediano de conectivos (' + r.connectiveHits + '). Tente conectar melhor as frases com "portanto", "além disso", "dessa forma".',
      baixo:'Poucos conectivos encontrados (' + r.connectiveHits + '). Sem eles, o texto fica com ideias soltas.',
    }),
    comp5: tierFeedback(r.comp5, {
      alto:'Proposta de intervenção completa: agente e ação de intervenção identificados no último parágrafo.',
      medio:'A proposta de intervenção existe, mas detalhe melhor quem vai agir (agente) e como (meio/ação).',
      baixo:'Não foi identificada uma proposta de intervenção clara no último parágrafo. Diga o quê fazer, quem faz e como.',
    }),
  };
}

function wireCronograma(){
  function refresh(){
    const table = document.getElementById('cronTable');
    table.innerHTML = `
      <div></div>
      ${WEEKDAYS.map(d=>`<div class="cron-head-cell">${d}</div>`).join('')}
      ${PERIODOS.map(([pk,pl])=>`
        <div class="cron-period-label">${pl}</div>
        ${WEEKDAYS.map((_,di)=>cellHTML(di,pk)).join('')}
      `).join('')}
    `;
    const {filled, totalSlots, hours} = cronCounts();
    const pct = Math.round(filled/totalSlots*100);
    document.getElementById('cronSummary').textContent = `${filled} de ${totalSlots} blocos planejados`;
    document.getElementById('cronBar').style.width = pct+'%';
    document.getElementById('cronFilled').textContent = filled;
    document.getElementById('cronHours').textContent = hours+'h';
    document.getElementById('cronPct').textContent = pct+'%';
    wireCells();
  }
  function wireCells(){
    document.querySelectorAll('[data-remove]').forEach(b=>{
      b.onclick = async ()=>{
        const key = b.dataset.remove;
        const prevVal = state.schedule[key];
        delete state.schedule[key];
        refresh();
        const ok = await deleteScheduleSlot(key);
        if(!ok){ state.schedule[key] = prevVal; refresh(); }
      };
    });
    document.querySelectorAll('select[data-add]').forEach(sel=>{
      sel.onchange = async ()=>{
        const key = sel.dataset.add;
        const materia = sel.value;
        if(!materia) return;
        const [dayIdx, periodKey] = key.split('_');
        const periodLabel = PERIODOS.find(p=>p[0]===periodKey)[1];
        state.schedule[key] = materia;
        refresh();
        const ok = await saveScheduleSlot(key, materia);
        if(ok) toast(materia+' adicionada em '+WEEKDAYS[dayIdx].toLowerCase()+' · '+periodLabel.toLowerCase());
        else { delete state.schedule[key]; refresh(); }
      };
    });
  }
  document.getElementById('clearAllBtn').addEventListener('click', async ()=>{
    const backup = {...state.schedule};
    state.schedule = {}; refresh();
    const ok = await clearScheduleDB();
    if(ok) toast('Cronograma limpo');
    else { state.schedule = backup; refresh(); }
  });
  wireCells();
}

/* ============================================================
   VALIDAÇÃO (e-mail e senha)
   ============================================================ */
function isValidEmail(email){
  // formato básico: algo@algo.algo, sem espaços, com domínio de ao menos 2 letras
  return /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(email.trim());
}
function passwordChecks(pw){
  return {
    len: pw.length >= 8,
    letter: /[a-zA-Z]/.test(pw),
    number: /[0-9]/.test(pw),
  };
}
function showFieldError(id, show){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('show', !!show);
}

function wireLogin(){
  const emailInp = document.getElementById('loginEmail');
  const passInp = document.getElementById('loginPass');
  emailInp.addEventListener('input', ()=>showFieldError('loginEmailError', false));
  passInp.addEventListener('input', ()=>showFieldError('loginPassError', false));
}

function wireCadastro(){
  const nomeInp = document.getElementById('cadNome');
  const emailInp = document.getElementById('cadEmail');
  const passInp = document.getElementById('cadPass');

  nomeInp.addEventListener('input', ()=>showFieldError('cadNomeError', false));
  emailInp.addEventListener('input', ()=>showFieldError('cadEmailError', false));

  function updatePwRules(){
    const checks = passwordChecks(passInp.value);
    const map = [['pwRuleLen','len'],['pwRuleLetter','letter'],['pwRuleNumber','number']];
    map.forEach(([id,key])=>{
      document.getElementById(id).classList.toggle('ok', checks[key]);
    });
    return checks;
  }
  passInp.addEventListener('input', updatePwRules);
  updatePwRules();
}

/* ============================================================
   AUTH FORM SUBMIT HANDLERS (delegated, since forms are re-rendered)
   ============================================================ */
document.addEventListener('submit', (e)=>{
  if(e.target.id==='loginForm'){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    let valid = true;
    if(!isValidEmail(email)){ showFieldError('loginEmailError', true); valid=false; } else { showFieldError('loginEmailError', false); }
    if(!pass){ showFieldError('loginPassError', true); valid=false; } else { showFieldError('loginPassError', false); }
    if(!valid){ toast('Corrija os campos destacados.', 'error'); return; }

    const btn = e.target.querySelector('button[type=submit]');
    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Entrando...';
    (async ()=>{
      const r = await apiFetch('login.php', { method:'POST', body:{ email, password: pass } });
      if(!r.ok){ toast(r.message || 'Não foi possível entrar.', 'error'); btn.disabled = false; btn.textContent = originalText; return; }
      state.user = r.data.user;
      toast('Login realizado com sucesso!');
      nav('home');
      loadFavorites();
      btn.disabled = false; btn.textContent = originalText;
    })();
  }
  if(e.target.id==='cadForm'){
    e.preventDefault();
    const name = document.getElementById('cadNome').value.trim();
    const email = document.getElementById('cadEmail').value.trim();
    const pass = document.getElementById('cadPass').value;
    const checks = passwordChecks(pass);
    let valid = true;
    if(!name){ showFieldError('cadNomeError', true); valid=false; } else { showFieldError('cadNomeError', false); }
    if(!isValidEmail(email)){ showFieldError('cadEmailError', true); valid=false; } else { showFieldError('cadEmailError', false); }
    if(!(checks.len && checks.letter && checks.number)){ valid=false; }
    if(!valid){ toast('Corrija os campos destacados antes de continuar.', 'error'); return; }

    const btn = e.target.querySelector('button[type=submit]');
    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Criando conta...';
    (async ()=>{
      const r = await apiFetch('register.php', { method:'POST', body:{ name, email, password: pass } });
      if(!r.ok){ toast(r.message || 'Não foi possível criar a conta.', 'error'); btn.disabled = false; btn.textContent = originalText; return; }
      state.user = r.data.user;
      toast('Conta criada com sucesso! Bem-vindo(a).');
      nav('home');
      btn.disabled = false; btn.textContent = originalText;
    })();
  }
  if(e.target.id==='cadProfForm'){
    e.preventDefault();
    const name = document.getElementById('cadProfNome').value.trim();
    const email = document.getElementById('cadProfEmail').value.trim();
    const pass = document.getElementById('cadProfPass').value;
    const code = document.getElementById('cadProfCode').value.trim();
    const checks = passwordChecks(pass);
    let valid = true;
    if(!name){ showFieldError('cadProfNomeError', true); valid=false; } else { showFieldError('cadProfNomeError', false); }
    if(!isValidEmail(email)){ showFieldError('cadProfEmailError', true); valid=false; } else { showFieldError('cadProfEmailError', false); }
    if(!(checks.len && checks.letter && checks.number)){ valid=false; }
    if(!code){ showFieldError('cadProfCodeError', true); valid=false; }
    if(!valid){ toast('Corrija os campos destacados antes de continuar.', 'error'); return; }

    const btn = e.target.querySelector('button[type=submit]');
    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = 'Criando conta...';
    (async ()=>{
      const r = await apiFetch('register_professor.php', { method:'POST', body:{ name, email, password: pass, invite_code: code } });
      if(!r.ok){
        if((r.message||'').toLowerCase().includes('convite')) showFieldError('cadProfCodeError', true);
        toast(r.message || 'Não foi possível criar a conta.', 'error');
        btn.disabled = false; btn.textContent = originalText; return;
      }
      state.user = r.data.user;
      toast('Conta de professor criada com sucesso!');
      nav('professor-home');
      btn.disabled = false; btn.textContent = originalText;
    })();
  }
});
document.addEventListener('click', (e)=>{
  const eye = e.target.closest('[data-eye]');
  if(eye){
    const inp = document.getElementById(eye.dataset.eye);
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    eye.innerHTML = showing ? ICO.eye : ICO.eyeOff;
  }
});

/* ============================================================
   INIT — verifica se já existe uma sessão PHP ativa
   ============================================================ */
(async ()=>{
  nav('login'); // tela inicial enquanto verifica a sessão
  const r = await apiFetch('session_check.php');
  if(r.ok && r.data.user){
    state.user = r.data.user;
    updateAuthUI();
    nav('home');
    loadFavorites();
  }
})();
</script>
